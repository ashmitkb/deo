<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <header class="top">
    <div class="indicator" aria-hidden="true">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="heading">
      <h1>Deo</h1>
      <div class="state-line"><span id="state">Idle</span><span class="sep">·</span><span id="info" class="info">Starting up…</span></div>
    </div>
    <button id="pause" class="glass-btn" type="button">Pause</button>
  </header>

  <main id="chat" class="chat" aria-live="polite">
    <div class="empty" id="empty">
      <div class="empty-title">Say “hey Deo”<br><span>or type below.</span></div>
    </div>
  </main>

  <footer class="bottom">
    <div class="controls">
      <button id="stop" class="glass-btn" type="button">Stop talking</button>
      <span class="hint">☝ right · ✌ left · F9 talk · F10 stop</span>
    </div>
    <form id="composer" class="composer glass" autocomplete="off">
      <input id="input" type="text" placeholder="Ask Deo anything" spellcheck="false">
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </footer>

  <script src="app.js"></script>
</body>
</html>
